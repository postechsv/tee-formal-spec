# Every feature of features.mk on:  make NAME=all CONFIG=features.toml
# A build configuration file sets features to 0 or 1, one "F = V" line each; a feature it does
# not set keeps its default.  Top-level keys only (no [table]): the Makefile includes the file.
CRYPTO = 1
TRANSIENT = 1
PERSISTENT = 1
GENERIC = 1
DATA_STREAM = 1
ENUMERATOR = 1
SHM = 1
